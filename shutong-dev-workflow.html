<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书童开发工作流</title>
<style>
:root{
  --bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;--text:#e5e5e5;--text2:#a0a0a0;
  --accent:#3b82f6;--accent-hi:#60a5fa;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --code-bg:#141414;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .logo{font-size:16px;font-weight:700;white-space:nowrap}
.topbar .modes{display:flex;gap:6px}
.mbtn{padding:7px 14px;border-radius:8px;border:2px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-weight:600;transition:.2s;white-space:nowrap}
.mbtn:hover{border-color:var(--text2)}
.mbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.mbtn.on-a{border-color:var(--ok);color:var(--ok);background:rgba(34,197,94,.08)}
.mbtn.on-b{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.mbtn.on-c{border-color:#f97316;color:#f97316;background:rgba(249,115,22,.08)}
.topbar .tools{display:flex;gap:6px}
.tbtn{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:.2s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
/* 面包屑 */
.breadcrumb{padding:10px 20px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);background:var(--card)}
.breadcrumb span{color:var(--text)}
/* 进度条 */
.progress{padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap}
.dot-wrap{display:flex;align-items:center}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);transition:.3s;position:relative}
.dot.done{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.12)}
.dot.done::after{content:'✓';position:absolute;font-size:14px}
.dot.done span{visibility:hidden}
.dot.now{border-color:var(--accent);color:#fff;background:var(--accent);transform:scale(1.15)}
.dot-line{width:28px;height:2px;background:var(--border);transition:.3s}
.dot-line.done{background:var(--accent)}
.dot-label{font-size:10px;color:var(--text2);text-align:center;margin-top:4px;position:absolute;top:36px;white-space:nowrap;left:50%;transform:translateX(-50%)}
/* 主内容 */
.main{max-width:860px;margin:0 auto;padding:20px 20px 120px}
/* 步骤卡片 */
.step-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:20px}
.step-head{padding:20px 24px;border-bottom:1px solid var(--border);overflow:visible}
.step-num{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.step-title{font-size:22px;font-weight:700;margin-bottom:4px}
.step-desc{font-size:14px;color:var(--text2)}
.step-tip{display:none}
/* 使用说明 */
.usage{margin:16px 20px;padding:14px 16px;border:1px dashed var(--border);border-radius:8px;font-size:13px;line-height:1.9}
.usage .ul{font-weight:700;margin-right:4px}
.usage .uv{color:var(--text2)}
/* 提示词块 */
.pblock{margin:12px 20px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--code-bg);border-bottom:1px solid var(--border)}
.ptag{font-size:12px;font-weight:600}
.ptag-e{color:var(--ok)}
.ptag-s{color:var(--accent)}
.copybtn{padding:4px 10px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:.2s}
.copybtn:hover{border-color:var(--accent);color:var(--accent)}
.copybtn.ok{border-color:var(--ok);color:var(--ok)}
.pbody{padding:14px;background:var(--code-bg);font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;color:var(--text)}
/* 审查结论区 */
.review{margin:16px 20px;padding:16px;border:1px solid var(--border);border-radius:10px;background:rgba(59,130,246,.03)}
.review h4{font-size:14px;margin-bottom:10px;color:var(--accent)}
.review textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;resize:vertical;outline:none;font-family:inherit}
.review textarea:focus{border-color:var(--accent)}
.review .radios{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}
.review label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text2)}
.review input[type=radio]{accent-color:var(--accent)}
/* 检查清单 */
.checks{margin:16px 20px;padding:14px 16px;border:1px solid var(--border);border-radius:10px}
.checks h4{font-size:13px;color:var(--warn);margin-bottom:8px}
.checks label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}
.checks label:last-child{border-bottom:none}
.checks input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
/* 问题折叠 */
.trouble{margin:12px 20px}
.trouble-btn{width:100%;padding:10px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;transition:.2s}
.trouble-btn:hover{border-color:var(--accent)}
.trouble-body{display:none;margin-top:8px;padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;line-height:1.8}
.trouble-body.open{display:block}
.trouble-body h5{color:var(--warn);margin:10px 0 4px;font-size:13px}
.trouble-body h5:first-child{margin-top:0}
.trouble-body code{background:var(--code-bg);padding:2px 6px;border-radius:3px;font-size:12px;cursor:pointer;transition:.15s}
.trouble-body code:hover{background:rgba(59,130,246,.15);color:var(--accent)}
/* 操作栏 */
.actionbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:100}
.abtn{padding:10px 22px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:6px}
.abtn:hover{border-color:var(--accent);color:var(--accent)}
.abtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.abtn.primary:hover{background:var(--accent-hi)}
.abtn.branch{border-color:var(--warn);color:var(--warn)}
.abtn.branch:hover{background:rgba(245,158,11,.1)}
.abtn:disabled{opacity:.3;cursor:not-allowed}
/* 编码分层指示 */
.layer-indicator{margin:12px 20px;padding:10px 14px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:8px;font-size:13px;color:var(--accent);text-align:center;font-weight:600}
/* 合并计划 */
.merge-plan{margin:16px 20px;padding:16px;border:2px solid var(--warn);border-radius:10px;background:rgba(245,158,11,.04)}
.merge-plan h4{color:var(--warn);margin-bottom:10px}
.merge-plan .summary{background:var(--bg);padding:12px;border-radius:6px;margin-bottom:12px;font-size:13px}
.merge-plan label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer}
.merge-plan input[type=radio]{accent-color:var(--warn)}
/* 完成总结 */
.done-summary{margin:16px 20px;padding:20px;border:2px solid var(--ok);border-radius:10px;background:rgba(34,197,94,.04);text-align:center}
.done-summary h3{color:var(--ok);font-size:20px;margin-bottom:12px}
.done-summary .stats{display:flex;justify-content:center;gap:24px;margin-bottom:16px;font-size:14px}
.done-summary .stat-val{font-size:24px;font-weight:700;color:var(--accent)}
/* 记事本 */
.np-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);width:24px;height:60px;background:var(--card);border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;z-index:99;transition:.3s}
.np-toggle:hover{color:var(--accent);border-color:var(--accent)}
.np-toggle.shifted{right:300px}
.np-panel{position:fixed;right:0;top:0;bottom:0;width:300px;background:var(--card);border-left:1px solid var(--border);z-index:101;display:flex;flex-direction:column;transform:translateX(100%);transition:.3s}
.np-panel.open{transform:translateX(0)}
.np-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.np-head h3{font-size:14px}
.np-tabs{display:flex;gap:4px}
.np-tab{padding:4px 10px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:.15s}
.np-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.np-actions{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
.np-actions button{flex:1;padding:5px 0;font-size:11px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:.15s}
.np-actions button:hover{border-color:var(--accent);color:var(--accent)}
.np-list{flex:1;overflow-y:auto;padding:8px}
.np-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden}
.np-card-head{padding:6px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.np-card-time{font-size:10px;color:var(--text2)}
.np-card-btns{display:flex;gap:3px}
.np-card-btns button{padding:2px 6px;font-size:10px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer}
.np-card-btns button:hover{border-color:var(--accent);color:var(--accent)}
.np-card-btns button.del:hover{border-color:var(--err);color:var(--err)}
.np-card-title{width:100%;padding:5px 8px;font-size:12px;font-weight:600;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none}
.np-card-title:focus{border-bottom-color:var(--accent)}
.np-card-body{width:100%;min-height:60px;padding:6px 8px;font-size:12px;border:none;resize:vertical;background:transparent;color:var(--text);outline:none;font-family:inherit;line-height:1.5}
.np-empty{text-align:center;padding:30px 16px;color:var(--text2);font-size:12px}
/* 首页模式选择 */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:24px}
.welcome h2{font-size:24px}
.welcome p{color:var(--text2);font-size:14px}
.mode-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.mode-card{width:240px;padding:24px;border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:.2s;text-align:center}
.mode-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.mode-card h3{font-size:18px;margin-bottom:8px}
.mode-card p{font-size:13px;color:var(--text2)}
.mc-a{border-color:var(--ok)}.mc-a:hover{border-color:var(--ok)}
.mc-a h3{color:var(--ok)}
.mc-b{border-color:var(--accent)}.mc-b:hover{border-color:var(--accent)}
.mc-b h3{color:var(--accent)}
.mc-c{border-color:#f97316}.mc-c:hover{border-color:#f97316}
.mc-c h3{color:#f97316}
/* 预审页 */
.pre-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;max-width:860px;margin:0 auto}
.pre-head{padding:20px 24px;border-bottom:1px solid var(--border)}
.pre-head h2{font-size:20px;font-weight:700;margin-bottom:4px}
.pre-head p{font-size:13px;color:var(--text2)}
.pre-step{padding:16px 24px}
.pre-step h4{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.pre-step textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;resize:vertical;outline:none;font-family:inherit;line-height:1.6}
.pre-step textarea:focus{border-color:var(--accent)}
.pre-radios{margin-top:10px}
.pre-radios label{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;cursor:pointer;color:var(--text2)}
.pre-radios input[type=radio]{margin-top:3px;accent-color:var(--accent)}
.pre-radios .opt-a{color:var(--ok)}
.pre-radios .opt-b{color:var(--accent)}
.pre-radios .opt-c{color:var(--err)}
.mc-btns{display:flex;gap:8px;margin-top:14px}
.mc-btn{flex:1;padding:8px 0;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;font-weight:600;transition:.2s;text-align:center}
.mc-btn:hover{border-color:var(--accent);color:var(--accent)}
.mc-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mc-btn.primary:hover{background:var(--accent-hi)}
/* 主题跟随 */
body.th-a{--accent:#22c55e;--accent-hi:#4ade80}
body.th-b{--accent:#3b82f6;--accent-hi:#60a5fa}
body.th-c{--accent:#f97316;--accent-hi:#fb923c}
/* 响应式 */
@media(max-width:768px){
  .topbar{flex-wrap:wrap;gap:8px}
  .topbar .modes{order:3;width:100%;justify-content:center}
  .main{padding:12px 12px 120px}
  .actionbar{padding:10px 12px;gap:6px}
  .abtn{padding:8px 14px;font-size:13px}
  .np-panel{width:100%}
  .mode-cards{flex-direction:column;align-items:center}
}
</style>
</head>
<body class="th-b">

<div class="topbar">
  <div class="logo"><span id="logoText" style="cursor:pointer" onclick="goHome()">📋 书童开发工作流</span></div>
  <div class="modes" id="modeBtns"></div>
  <div class="tools">
    <button class="tbtn" onclick="toggleLang()" id="langBtn">EN</button>
    <button class="tbtn" onclick="exportState()" id="expBtn">📥 导出</button>
    <button class="tbtn" onclick="importState()" id="impBtn">📤 导入</button>
    <button class="tbtn" onclick="resetState()" id="rstBtn">🔄 重置</button>
  </div>
</div>

<div id="app"></div>

<div class="np-toggle" onclick="toggleNP()" id="npToggle">◀</div>
<div class="np-panel" id="npPanel">
  <div class="np-head">
    <h3><span id="npTitle">📋 记事本</span> <span style="cursor:pointer;margin-left:8px;font-size:16px" onclick="toggleNP()">✕</span></h3>
    <div class="np-tabs">
      <button class="np-tab on" id="npTabReq" onclick="setNPType('req')">需求</button>
      <button class="np-tab" id="npTabNote" onclick="setNPType('note')">笔记</button>
    </div>
  </div>
  <div class="np-actions">
    <button onclick="addNP()" id="npNewBtn">＋ 新建</button>
    <button onclick="exportNP()" id="npExpBtn">📥 导出</button>
  </div>
  <div class="np-list" id="npList"></div>
</div>

<div class="actionbar" id="actionBar" style="display:none">
  <button class="abtn" id="btnPrev" onclick="goPrev()">⬅️ 上一步</button>
  <button class="abtn branch" id="btnBranch" onclick="doBranch()">➕ 插入新需求</button>
  <button class="abtn primary" id="btnNext" onclick="goNext()">下一步 ➡️</button>
</div>

<script>
// ========== 提示词数据 ==========
const P={
modeA:{
  name:'从零新建项目',theme:'green',themeCls:'th-a',
  steps:[
    {id:'init',name:'初始化',desc:'跟AI聊清楚用什么技术、怎么组织文件、做完怎么验收',
     exec:`【阶段：初始化】从零新建项目，先搭建骨架，不改代码。

需求：{{你的项目需求}}

请回答：
1. 【技术选型】根据需求，推荐技术栈（前端/后端/数据库/部署），说明理由
2. 【目录结构】设计项目目录树，说明每个目录放什么
3. 【依赖规划】核心依赖有哪些？版本建议？
4. 【入口设计】主入口文件是什么？启动方式？
5. 【配置设计】需要哪些配置文件？环境变量？
6. 【扩展预留】未来可能扩展的模块，预留什么接口/目录？
7. 【验收标准】你希望怎么证明这个项目"做完了"？功能清单、验收测试、性能要求

要求：
- 只输出设计，不生成代码
- 如果有不确定的技术选型，列出选项和利弊，等待用户确认
- 输出 [INIT_DONE]`,
     execU:{to:'窗口B（执行AI）',when:'项目开始时',expect:'7个答案 + [INIT_DONE]',next:'复制给策略AI审查'},
     strat:`【策略AI审查】初始化阶段

请审查以下初始化方案：
{{粘贴执行AI的返回}}

审查要点：
1. 技术选型是否合理？是否匹配项目需求？
2. 目录结构是否清晰？是否符合该技术的最佳实践？
3. 依赖规划是否完整？版本是否稳定？
4. 验收标准是否可验证？是否具体？

状态判断：直接通过 / 需补充 / 需调整

如通过，输出下一步指令：进入「设计」阶段`,
     stratU:{to:'窗口A（策略AI）',when:'收到初始化方案后',expect:'审查结论 + 下一步指令',next:'进入「设计」阶段'},
     checks:['技术选型匹配项目需求','目录结构符合最佳实践','依赖版本稳定且兼容','验收标准具体可验证'],
    execEn:`[Stage: INIT] Build new project from scratch. Design skeleton first, no code changes.

Requirement: {{your project requirement}}

Please answer the following questions. Each must provide specific suggestions and rationale.

1. [Tech Stack] Based on requirements, recommend tech stack
   - Frontend: framework, UI library, build tools (if applicable)
   - Backend: language, framework, ORM (if applicable)
   - Database: type, version (if applicable)
   - Deployment: target platform, containerization (if applicable)
   - Explain rationale for each choice

2. [Directory Structure] Design project directory tree
   - Show complete structure as a tree diagram
   - Explain what each directory/file contains
   - Mark which are core modules, which are auxiliary

3. [Dependency Planning] What are the core dependencies?
   - List all packages to install
   - Suggest version numbers
   - Mark required vs optional

4. [Entry Point] What is the main entry file?
   - Startup method (CLI/script/double-click)
   - Startup parameters (if any)

5. [Config Design] What config files are needed?
   - Environment variables (name, purpose, default)
   - Config file format (YAML/JSON/TOML/.env)

6. [Extension Points] Future modules to reserve
   - What interfaces/directories to reserve

7. [Acceptance Criteria] How to prove this project is "done"?
   - Feature list: which features must work?
   - Acceptance tests: how to verify?

Requirements:
- Output design only, do not generate code
- If tech selection is uncertain, list options with pros/cons
- Output [INIT_DONE]`,
    stratEn:`[INIT Review Task]

Please review the following initialization plan from Execution AI.

## Execution AI Init Response:
{{Execution AI Init Response}}

## Your Task:

### Step 1: Completeness Review
- [ ] All 7 questions answered
- [ ] Tech stack has specific framework and version
- [ ] Directory structure has complete tree diagram
- [ ] Dependency list has names and versions
- [ ] Entry file and startup method are clear
- [ ] Config file checklist is complete
- [ ] Acceptance criteria are specific and testable
- [ ] Has [INIT_DONE] marker at end

If any item fails, output [Follow-up Instruction].

### Step 2: Tech Stack Confirmation
- Does it match user requirements?
- Any obvious compatibility issues?
- Is dependency count reasonable?

### Step 3: Output Next Stage Instruction
If review passes, output [DESIGN-Architecture] instruction.

[Review Passed! Next Step]
-> Go to Design stage, copy Execution AI Prompt`},

    {id:'design',name:'设计',desc:'画清楚数据怎么流转、先搭什么后搭什么',
     exec:`【阶段：设计】从零新建项目的架构设计

function render(){
  document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中';

  document.getElementById('npTabNote').textContent=t('npNote');
  document.getElementById('npNewBtn').textContent=t('npNew');
  document.getElementById('npExpBtn').textContent=t('npExport');
  renderNP();
  if(!S){renderWelcome();return}
  if(S.isPreReview){
    document.body.className=P[S.mode].themeCls;
    renderModeBtns();
    renderPreReview();return;
  }
  const m=P[S.mode];
  document.body.className=m.themeCls;
  renderModeBtns();
  if(S.done){renderDone();return}
  if(S.branchStack.length && S.branchStack[S.branchStack.length-1].mergePending){renderMerge();return}
  renderStep();
  document.getElementById('actionBar').style.display='flex';
  updateActionBtns();
}

function renderModeBtns(){
  const btns=document.getElementById('modeBtns');
  btns.innerHTML=['A','B','C'].map(k=>{
    const m=P['mode'+k];
    const cls=S&&S.mode===('mode'+k)?'mbtn on-'+k.toLowerCase():'mbtn';
    const label=k==='A'?'🆕 '+t('newP'):k==='B'?'➕ '+t('addF'):'🔧 '+t('fixI');
    return `<button class="${cls}" onclick="switchMode('${k}')">${label}</button>`;
  }).join('');
}

function renderStep(){
  const m=P[S.mode];
  const s=m.steps[S.step];
  const sd=S.stepsData[S.step];
  const total=m.steps.length;
  const isLayered=s.isLayered;

  const curExec=isLayered?(lang==='en'&&s.layers[S.layer].execEn?s.layers[S.layer].execEn:s.layers[S.layer].exec):(lang==='en'&&s.execEn?s.execEn:s.exec);
  const curStrat=lang==='en'&&s.stratEn?s.stratEn:s.strat;

  let bc=`<div class="breadcrumb"><span>${m.name}</span>`;
  S.branchStack.forEach(b=>{bc+=` > 🔀 ${b.name}`});
  bc+=` > <span>${s.name}${isLayered?' ('+t('layer')+(S.layer+1)+'/'+t('of')+s.layers.length+': '+s.layers[S.layer].name+')':''}</span></div>`;

  let prog='<div class="progress">';
  m.steps.forEach((st,i)=>{
    if(i>0)prog+=`<div class="dot-line${i<=S.step?' done':''}"></div>`;
    const cls=i<S.step?'done':i===S.step?'now':'';
    prog+=`<div class="dot-wrap"><div class="dot ${cls}"><span>${i+1}</span><div class="dot-label">${st.name}</div></div></div>`;
  });
  prog+='</div>';

  const reviewText=sd.review||'';
  const verdict=sd.verdict;

  let html=bc+prog;
  html+=`<div class="step-card">`;
  html+=`<div class="step-head"><div class="step-num">${t('step')} ${S.step+1} / ${total}${isLayered?' · '+t('layer')+(S.layer+1)+'/'+t('of')+s.layers.length:''}</div>`;
  html+=`<div class="step-title">${s.name}${isLayered?' - '+s.layers[S.layer].name:''}</div>`;
  html+=`<div class="step-desc">${s.desc}</div></div>`;

  html+=`<div class="usage"><span class="ul">${t('usage')}</span><br>`;
  html+=`<span class="ul">${t('sendTo')}</span><span class="uv">${s.execU.to}</span><br>`;
  html+=`<span class="ul">${t('timing')}</span><span class="uv">${s.execU.when}</span><br>`;
  html+=`<span class="ul">${t('expect')}</span><span class="uv">${s.execU.expect}</span><br>`;
  html+=`<span class="ul">${t('nextStep')}</span><span class="uv">${s.execU.next}</span></div>`;
  html+=`<div class="pblock"><div class="phead"><span class="ptag ptag-e">${t('execTag')}</span><button class="copybtn" onclick="cpBlock(this)">${t('copy')}</button></div>`;
  html+=`<div class="pbody">${esc(curExec)}</div></div>`;

  if(curStrat){
    html+=`<div class="usage"><span class="ul">${t('usage')}</span><br>`;
    html+=`<span class="ul">${t('sendTo')}</span><span class="uv">${s.stratU.to}</span><br>`;
    html+=`<span class="ul">${t('timing')}</span><span class="uv">${s.stratU.when}</span><br>`;
    html+=`<span class="ul">${t('expect')}</span><span class="uv">${s.stratU.expect}</span><br>`;
    html+=`<span class="ul">${t('nextStep')}</span><span class="uv">${s.stratU.next}</span></div>`;
    html+=`<div class="pblock"><div class="phead"><span class="ptag ptag-s">${t('stratTag')}</span><button class="copybtn" onclick="cpBlock(this)">${t('copy')}</button></div>`;
    html+=`<div class="pbody">${esc(curStrat)}</div></div>`;
  }

  html+=`<div class="review"><h4>${t('review')}</h4>`;
  html+=`<textarea placeholder="${t('reviewPh')}" oninput="onReviewInput(this)">${reviewText}</textarea>`;
  html+=`<div class="radios">`;
  html+=`<label><input type="radio" name="verdict" value="pass" ${verdict==='pass'?'checked':''} onclick="setVerdict('pass')"> ${t('pass')}</label>`;
  html+=`<label><input type="radio" name="verdict" value="补充" ${verdict==='补充'?'checked':''} onclick="setVerdict('补充')"> ${t('need补充')}</label>`;
  html+=`<label><input type="radio" name="verdict" value="fix" ${verdict==='fix'?'checked':''} onclick="setVerdict('fix')"> ${t('needFix')}</label>`;
  html+=`</div></div>`;

  html+=`<div class="checks"><h4>${t('checks')}</h4>`;
  s.checks.forEach((c,i)=>{
    const checked=sd.checks.includes(i)?'checked':'';
    html+=`<label><input type="checkbox" ${checked} onchange="toggleCheck(${i},this)"> ${c}</label>`;
  });
  html+=`</div>`;

  // 问题折叠
  html+=`<div class="trouble"><button class="trouble-btn" onclick="this.nextElementSibling.classList.toggle('open')">⚠️ 遇到问题？<span>▶</span></button>`;
  html+=`<div class="trouble-body">${TROUBLE}</div></div>`;

  html+=`</div>`;
  document.getElementById('app').innerHTML=html;
}

function renderMerge(){
  const m=P[S.mode];
  const top=S.branchStack[S.branchStack.length-1];
  const fromStep=P[top.fromMode].steps[top.fromStep];

  let html=`<div class="step-card"><div class="step-head">`;
  html+=`<div class="step-num">🔀 分支合并</div>`;
  html+=`<div class="step-title">合并计划</div>`;
  html+=`<div class="step-desc">分支流程已完成，选择合并回主流程的位置</div></div>`;

  html+=`<div class="merge-plan"><h4>🔀 分支完成 - 合并计划</h4>`;
  html+=`<div class="summary">`;
  html+=`<div><strong>分支类型：</strong>${top.name}</div>`;
  html+=`<div><strong>涉及阶段：</strong>${P[top.branchType].steps.map(s=>s.name).join(' → ')}</div>`;
  html+=`<div><strong>插入点：</strong>${fromStep.name} 阶段</div>`;
  html+=`</div>`;

  html+=`<div style="margin-bottom:12px;font-weight:600">${lang==='zh'?'合并后回到主流程的位置：':'Where to merge back:'}</div>`;
  html+=`<label><input type="radio" name="merge" value="current" checked> ${lang==='zh'?'回到':'Return to'}「${fromStep.name}」${lang==='zh'?'阶段（继续主流程）':'stage (continue main flow)'}</label>`;
  const nextIdx=top.fromStep+1;
  if(nextIdx<m.steps.length){
    html+=`<label><input type="radio" name="merge" value="next"> ${lang==='zh'?'跳到':'Skip to'}「${m.steps[nextIdx].name}」${lang==='zh'?'阶段（分支已完成该阶段工作）':'stage (branch already completed this)'}</label>`;
  }
  html+=`</div>`;

  html+=`<div style="padding:16px 20px;text-align:center">`;
  html+=`<button class="abtn primary" onclick="confirmMerge()" style="display:inline-flex">${t('mergeConfirm')}</button>`;
  html+=`</div></div>`;

  document.getElementById('app').innerHTML=html;
  document.getElementById('actionBar').style.display='none';
}

function renderDone(){
  const m=P[S.mode];
  let branchCount=S.branchStack.length;
  let html=`<div class="step-card"><div class="done-summary">`;
  html+=`<h3>${t('doneTitle')}</h3>`;

  document.getElementById('app').innerHTML=html;
  document.getElementById('actionBar').style.display='none';

}

const PRE_REVIEW_PROMPT=`【文档预审】MVP文档质量审查

你是一位资深技术负责人。请审查以下MVP文档，判断它是否具备进入工程执行的条件。

MVP文档：
{{粘贴你的MVP文档}}

请按以下维度逐项审查，每项给出「✅ 具备 / ⚠️ 有缺口 / ❌ 缺失」：

1. 【需求边界】功能范围是否清晰？有没有"等等""之类""相关"等模糊词？
2. 【用户场景】这个功能给谁用？在什么场景下用？是否明确？

7. 【异常处理】错误场景有考虑吗？（网络失败、数据为空、权限不足、并发冲突等）

━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📊 文档质量评分：X / 10 分
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

【评分标准】
- 10分：10项全部✅具备，文档可直接进入编码
- 8-9分：1-2项⚠️有缺口，补充后可直接推进
- 5-7分：3-5项有缺口，需要补充信息后再进入工作流
- 0-4分：超过5项缺失，建议重新梳理需求

缺口清单（逐项列出有缺口/缺失的项）：
- 缺口1：...（具体说明缺了什么）
- 缺口2：...

建议进入阶段：
○ A. 文档完整 → 可直接进入「设计」阶段（技术选型已确认，只需细化架构）
○ B. 有缺口 → 先进入「初始化」补充缺口信息，再按流程推进

如选B，请列出需要补充的具体问题清单（用户可以直接复制给执行AI）。`;

You are a senior technical lead. Please review the following MVP document and determine if it is ready for engineering execution.

MVP Document:
{{Paste your MVP document}}

Please review each dimension and rate as "✅ Ready / ⚠️ Has Gaps / ❌ Missing":

1. [Scope] Is the feature scope clear? Any vague words like "etc.", "similar", "related"?
2. [User Scenarios] Who uses this? In what context? Is it clear?
3. [Tech Stack] Is the tech stack specified (language/framework/database/deployment)?
4. [Data Structure] Are core data fields and types defined?
5. [Interface Definition] Are inputs/outputs clear? Parameters and return values documented?
6. [Acceptance Criteria] How to prove this feature is "done"? Are there verifiable criteria?
7. [Error Handling] Are error scenarios considered? (network failure, empty data, permission issues, concurrency)

Document Quality Score: X / 10
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[Scoring]
- 10: All 10 items ✅ Ready, can go directly to coding
- 8-9: 1-2 items ⚠️ Has Gaps, can proceed after filling
- 5-7: 3-5 items have gaps, need补充before entering workflow
- 0-4: More than 5 missing, recommend re-scoping requirements

Recommended Entry Stage:
○ A. Document Complete -> Enter "Design" stage directly

○ C. Insufficient -> Enter "Init" to re-scope, use document as raw input

If B, list specific questions to fill (user can copy to Execution AI).`;

function startPreReview(mode){
  S={mode:'mode'+mode,isPreReview:true,preReview:{document:'',verdict:null},step:0,layer:0,branchStack:[],stepsData:[],done:false};
  document.body.className=P[S.mode].themeCls;
  renderModeBtns();
  saveState();
  render();
}

function renderPreReview(){
  const m=P[S.mode];
  const pr=S.preReview;
  const PRE_PROMPT=lang==='en'?PRE_REVIEW_PROMPT_EN:PRE_REVIEW_PROMPT;
  document.getElementById('actionBar').style.display='none';
  let h=`<div class="pre-card">`;
  h+=`<div class="pre-head"><h2>${t('preTitle')}</h2><p>${t('preMode')}${m.name} ｜ ${t('preQuality')}</p></div>`;

  h+=`<div class="pre-step"><h4>${t('preStep1')}</h4>`;
  h+=`<textarea placeholder="${t('preStep1Ph')}" oninput="S.preReview.document=this.value;saveState()">${pr.document}</textarea></div>`;

  h+=`<div class="pre-step"><h4>${t('preStep2')}</h4>`;
  h+=`<div class="usage"><span class="ul">${t('usage')}</span><br>`;
  h+=`<span class="ul">${t('sendTo')}</span><span class="uv">${lang==='zh'?'窗口A（策略AI / Kimi）':'Window A (Strategy AI / Kimi)'}</span><br>`;
  h+=`<span class="ul">${t('timing')}</span><span class="uv">${lang==='zh'?'正式进入工作流之前，先审查文档质量':'Before entering workflow, review document quality'}</span><br>`;
  h+=`<span class="ul">${t('expect')}</span><span class="uv">${lang==='zh'?'10项维度评分 + 缺口清单 + 分流建议':'10-dimension scoring + gap list + routing advice'}</span><br>`;
  h+=`<span class="ul">${lang==='zh'?'注意：':'Note:'}</span><span class="uv">${lang==='zh'?'点击「复制」后，上方粘贴的文档会自动嵌入提示词':'Clicking Copy will embed your document into the prompt'}</span></div>`;
  h+=`<div class="pblock"><div class="phead"><span class="ptag ptag-s">${lang==='zh'?'S 审查提示词':'S Review Prompt'}</span><button class="copybtn" onclick="copyReviewPrompt()">${t('preCopy')}</button></div>`;
  h+=`<div class="pbody">${esc(PRE_PROMPT)}</div></div></div>`;

  h+=`<div class="pre-step"><h4>${t('preStep3')}</h4>`;
  h+=`<div class="pre-radios">`;
  h+=`<label class="opt-a"><input type="radio" name="preVerdict" value="A" ${pr.verdict==='A'?'checked':''} onclick="S.preReview.verdict='A';saveState()"> ${t('preA')}</label>`;
  h+=`<label class="opt-b"><input type="radio" name="preVerdict" value="B" ${pr.verdict==='B'?'checked':''} onclick="S.preReview.verdict='B';saveState()"> ${t('preB')}</label>`;
  h+=`<label class="opt-c"><input type="radio" name="preVerdict" value="C" ${pr.verdict==='C'?'checked':''} onclick="S.preReview.verdict='C';saveState()"> ${t('preC')}</label>`;
  h+=`</div></div>`;

  h+=`<div style="padding:16px 24px;display:flex;gap:10px;border-top:1px solid var(--border)">`;
  h+=`<button class="abtn" onclick="goHome()">${t('back')}</button>`;
  h+=`<button class="abtn primary" onclick="enterWorkflowFromPreReview()" style="margin-left:auto">${t('confirm')}</button>`;
  h+=`</div></div>`;

  document.getElementById('app').innerHTML=h;
}

function copyReviewPrompt(){
  if(!S||!S.isPreReview)return;
  const doc=S.preReview.document;
  if(!doc||!doc.trim()){alert(t('docAlert'));return}
  const tpl=lang==='en'?PRE_REVIEW_PROMPT_EN:PRE_REVIEW_PROMPT;
  const full=tpl.replace(/{{[^}]+}}/g,doc);
  navigator.clipboard.writeText(full).then(()=>{
    const btns=document.querySelectorAll('.copybtn');
    const btn=Array.from(btns).find(b=>b.textContent.includes(lang==='zh'?'复制审查':'Copy Review'));
    if(btn){btn.textContent=t('copied');btn.classList.add('ok');setTimeout(()=>{btn.textContent=t('preCopy');btn.classList.remove('ok')},1500)}
  });
}

function enterWorkflowFromPreReview(){
  if(!S||!S.isPreReview)return;
  const verdict=S.preReview.verdict;
  if(!verdict){alert(t('confirmAlert'));return}
  const mode=S.mode;
  const pr=S.preReview;

  S=defaultState(mode);
  S.preReview=pr;

  if(verdict==='A'){
    S.step=1;
    S.stepsData[0].review=pr.document;
  } else if(verdict==='B'){
    S.stepsData[0].review='参考文档（有缺口，需补充）：\n'+pr.document.substring(0,500)+'...';
  } else {
    S.stepsData[0].review='参考文档（质量不足，需重新梳理）：\n'+pr.document.substring(0,500)+'...';
  }
  saveState();render();
}

function switchMode(mode){
  if(S&&S.mode===('mode'+mode))return;
  if(S&&S.step>0&&!confirm(t('switchConfirm')))return;
  S=defaultState('mode'+mode);
  saveState();
  render();
}

function goNext(){
  if(!S)return;
  const m=P[S.mode];
  const s=m.steps[S.step];
  const sd=S.stepsData[S.step];

  // 编码分层
  if(s.isLayered && S.layer < s.layers.length-1){
    S.layer++;
    saveState();render();return;
  }

  if(S.step < m.steps.length-1){
    S.step++;
    S.layer=0;
    if(!S.stepsData[S.step])S.stepsData[S.step]={review:'',verdict:null,checks:[]};
    saveState();render();
  } else {
    S.done=true;
    saveState();render();
  }
}

function goPrev(){
  if(!S)return;
  if(S.layer>0){S.layer--;saveState();render();return}
  if(S.step>0){S.step--;S.layer=0;saveState();render()}
}

function updateActionBtns(){
  const m=P[S.mode];
  const s=m.steps[S.step];
  const btnPrev=document.getElementById('btnPrev');
  const btnNext=document.getElementById('btnNext');
  const btnBranch=document.getElementById('btnBranch');
  btnPrev.disabled=S.step===0&&S.layer===0;
  btnPrev.textContent=t('prev');
  btnBranch.textContent=t('insert');
  const isLastStep=S.step===m.steps.length-1;
  const isLastLayer=!s.isLayered||S.layer===s.layers.length-1;
  btnNext.textContent=isLastStep&&isLastLayer?t('done'):t('next');
  btnBranch.style.display=(S.step>=1&&S.step<m.steps.length-1)?'flex':'none';
}

function onReviewInput(ta){
  S.stepsData[S.step].review=ta.value;
  const text=ta.value;
  let detected=null;
  for(const kw of REVIEW_KW.pass){if(text.includes(kw)){detected='pass';break}}
  if(!detected)for(const kw of REVIEW_KW['补充']){if(text.includes(kw)){detected='补充';break}}
  if(!detected)for(const kw of REVIEW_KW.fix){if(text.includes(kw)){detected='fix';break}}
  if(detected){
    S.stepsData[S.step].verdict=detected;
    document.querySelectorAll('input[name=verdict]').forEach(r=>{r.checked=r.value===detected});
  }
  saveState();
}

function setVerdict(v){
  S.stepsData[S.step].verdict=v;
  saveState();
}

function toggleCheck(idx,el){
  const sd=S.stepsData[S.step];
  if(el.checked){if(!sd.checks.includes(idx))sd.checks.push(idx)}
  else{sd.checks=sd.checks.filter(i=>i!==idx)}
  saveState();
}

// ========== 分支 ==========
function doBranch(){
  if(!S)return;
  const m=P[S.mode];
  const s=m.steps[S.step];
  const name=prompt(t('branchName'),t('branchDefault'));
  if(!name)return;
  S.branchStack.push({
    name:name,
    fromMode:S.mode,
    fromStep:S.step,
    branchType:'modeB',
    savedState:JSON.parse(JSON.stringify({step:S.step,layer:S.layer,stepsData:S.stepsData})),
    mergePending:false
  });
  S.mode='B';
  S.step=0;
  S.layer=0;
  S.stepsData=P.modeB.steps.map(()=>({review:'',verdict:null,checks:[]}));
  saveState();render();
}

function confirmMerge(){
  if(!S||!S.branchStack.length)return;
  const top=S.branchStack.pop();
  const radio=document.querySelector('input[name=merge]:checked');
  const val=radio?radio.value:'current';
  S.mode=top.fromMode;
  if(val==='current'){
    S.step=top.fromStep;
  } else {
    S.step=Math.min(top.fromStep+1,P[top.fromMode].steps.length-1);
  }
  S.layer=0;
  saveState();render();
}

// ========== 记事本 ==========
let npType='req';
const NP_KEY='shutong_notepads';

function loadNP(){try{return JSON.parse(localStorage.getItem(NP_KEY))||{req:[],note:[]}}catch(e){return{req:[],note:[]}}}
function saveNP(d){localStorage.setItem(NP_KEY,JSON.stringify(d))}
function setNPType(t){
  npType=t;
  document.querySelectorAll('.np-tab').forEach(el=>el.classList.remove('on'));
  document.querySelector('.np-tab[onclick*="'+t+'"]').classList.add('on');
  renderNP();
}
function addNP(){
  const d=loadNP();
  const now=new Date();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  d[npType].unshift({id:Date.now(),title:npType==='req'?t('npNewReq'):t('npNewNote'),body:'',time:ts});
  saveNP(d);renderNP();
}
function delNP(id){const d=loadNP();d[npType]=d[npType].filter(n=>n.id!==id);saveNP(d);renderNP()}
function updateNP(id,f,v){const d=loadNP();const it=d[npType].find(n=>n.id===id);if(it){it[f]=v;saveNP(d)}}
function cpNP(id){
  const d=loadNP();const it=d[npType].find(n=>n.id===id);if(!it)return;
  navigator.clipboard.writeText(it.body).then(()=>{
    const btn=document.querySelector('[data-cp="'+id+'"]');
    if(btn){btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200)}
  });
}
function exportNP(){
  const d=loadNP();let t='=== 需求 ===\n\n';
  d.req.forEach(n=>{t+='## '+n.title+' ('+n.time+')\n'+n.body+'\n\n'});
  t+='=== 笔记 ===\n\n';
  d.note.forEach(n=>{t+='## '+n.title+' ('+n.time+')\n'+n.body+'\n\n'});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));
  a.download='notepads.txt';a.click();
}
function toggleNP(){
  const panel=document.getElementById('npPanel');
  const btn=document.getElementById('npToggle');
  panel.classList.toggle('open');
  btn.classList.toggle('shifted');
  btn.textContent=panel.classList.contains('open')?'▶':'◀';
}
function renderNP(){
  const d=loadNP();const list=d[npType];
  const c=document.getElementById('npList');
  if(!list.length){c.innerHTML=`<div class="np-empty">${t('npEmpty')}${npType==='req'?t('npReq'):t('npNote')}${t('npEmpty2')}</div>`;return}
  let h='';
  list.forEach(n=>{
    h+=`<div class="np-card"><div class="np-card-head"><span class="np-card-time">${n.time}</span>`;
    h+=`<div class="np-card-btns"><button data-cp="${n.id}" onclick="cpNP(${n.id})">${t('npCopy')}</button>`;
    h+=`<button class="del" onclick="delNP(${n.id})">${t('npDel')}</button></div></div>`;
    h+=`<input class="np-card-title" value="${n.title.replace(/"/g,'&quot;')}" onchange="updateNP(${n.id},'title',this.value)">`;
    h+=`<textarea class="np-card-body" placeholder="${t('npPh')}" oninput="updateNP(${n.id},'body',this.value)">${n.body}</textarea></div>`;
  });
  c.innerHTML=h;
}

// ========== 工具 ==========
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cp(el){
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const o=el.textContent;el.textContent='已复制';el.style.color='var(--ok)';
    setTimeout(()=>{el.textContent=o;el.style.color=''},1200);
  });
}
function cpBlock(btn){
  const body=btn.closest('.pblock').querySelector('.pbody');
  navigator.clipboard.writeText(body.textContent).then(()=>{
    btn.textContent='已复制 ✓';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='一键复制';btn.classList.remove('ok')},1500);
  });
}

function exportState(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='shutong-progress.json';a.click();
}
function importState(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{S=JSON.parse(ev.target.result);saveState();render();alert('导入成功')}catch(e){alert('导入失败：文件格式错误')}};
    reader.readAsText(file);
  };
  input.click();
}
function resetState(){
  if(!confirm(t('resetConfirm')))return;
  S=null;localStorage.removeItem(STATE_KEY);render();
}
function goHome(){
  S=null;render();
}
function exportReport(){
  const m=P[S.mode];
  let r=`书童开发工作流 - 执行报告\n${'='.repeat(40)}\n\n`;
  r+=`模式：${m.name}\n`;
  r+=`总步骤：${m.steps.length}\n`;
  r+=`分支数：${S.branchStack.length}\n\n`;
  r+=`步骤明细：\n`;
  m.steps.forEach((s,i)=>{
    const sd=S.stepsData[i]||{};
    const v=sd.verdict||'未审查';
    r+=`  ${i+1}. ${s.name} [${v}]\n`;
  });
  const blob=new Blob([r],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='shutong-report.txt';a.click();
}

// 键盘快捷键
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();goNext()}
  if(e.key==='ArrowLeft'){e.preventDefault();goPrev()}
});

// 初始化
S=loadState();
render();
renderNP();
</script>
