<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书童开发工作流 v2.0</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --code-bg: #1e2530;
            --mode-a: #3fb950;   /* 绿色 - 从零新建 */
            --mode-b: #58a6ff;   /* 蓝色 - 新增功能 */
            --mode-c: #d29922;   /* 橙色 - 修复问题 */
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary); color: var(--text-primary); line-height:1.6; overflow-x:hidden;
        }
        /* ===== 顶部栏 ===== */
        .top-bar {
            position:fixed; top:0; left:0; right:0; height:60px;
            background:var(--bg-secondary); border-bottom:1px solid var(--border-color);
            display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:1000;
        }
        .logo { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; }
        .logo .ver { font-size:11px; color:var(--text-secondary); font-weight:400; background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; }
        .mode-tabs { display:flex; gap:8px; }
        .mode-btn {
            padding:8px 16px; border-radius:8px; border:2px solid var(--border-color);
            background:var(--bg-tertiary); color:var(--text-primary); cursor:pointer;
            font-size:13px; font-weight:600; transition:all .2s; white-space:nowrap;
        }
        .mode-btn:hover { border-color:var(--text-secondary); }
        .mode-btn.active-a { border-color:var(--mode-a); background:rgba(63,185,80,.12); color:var(--mode-a); }
        .mode-btn.active-b { border-color:var(--mode-b); background:rgba(88,166,255,.12); color:var(--mode-b); }
        .mode-btn.active-c { border-color:var(--mode-c); background:rgba(210,153,34,.12); color:var(--mode-c); }
        /* ===== 布局 ===== */
        .layout { display:flex; margin-top:60px; min-height:calc(100vh - 60px); }
        .sidebar {
            width:240px; background:var(--bg-secondary); border-right:1px solid var(--border-color);
            position:fixed; top:60px; bottom:0; overflow-y:auto; padding:16px 0;
        }
        .nav-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); padding:8px 16px; margin-bottom:4px; }
        .nav-item {
            display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer;
            color:var(--text-secondary); font-size:13px; transition:all .15s; border-left:3px solid transparent;
        }
        .nav-item:hover { background:var(--bg-tertiary); color:var(--text-primary); }
        .nav-item.active { background:rgba(88,166,255,.08); color:var(--accent); border-left-color:var(--accent); }
        .nav-item .num {
            display:inline-flex; align-items:center; justify-content:center;
            width:22px; height:22px; border-radius:5px; background:var(--bg-tertiary);
            font-size:11px; font-weight:700; flex-shrink:0;
        }
        .nav-item.active .num { background:var(--accent); color:#fff; }
        .nav-arrow { color:var(--text-secondary); font-size:10px; text-align:center; padding:2px 0; opacity:.4; }
        .nav-end { color:var(--text-secondary); font-size:12px; text-align:center; padding:12px 16px; border-top:1px dashed var(--border-color); margin-top:8px; }
        .main-content { margin-left:240px; flex:1; padding:28px 32px; max-width:920px; }
        /* ===== 流程图 ===== */
        .flow-bar {
            display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:16px 20px;
            background:var(--bg-tertiary); border-radius:10px; margin-bottom:28px; border:1px solid var(--border-color);
        }
        .flow-step {
            padding:6px 14px; background:var(--bg-secondary); border:1px solid var(--border-color);
            border-radius:6px; font-size:12px; font-weight:600;
        }
        .flow-arrow { color:var(--text-secondary); font-size:14px; }
        .flow-loop { font-size:11px; color:var(--text-secondary); margin-left:8px; }
        /* ===== 阶段卡片 ===== */
        .stage-card {
            margin-bottom:40px; background:var(--bg-secondary); border:1px solid var(--border-color);
            border-radius:12px; overflow:hidden; scroll-margin-top:80px;
        }
        .card-head {
            padding:20px 24px 16px; border-bottom:1px solid var(--border-color);
            display:flex; align-items:center; gap:12px;
        }
        .card-badge {
            width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:700; color:#fff; flex-shrink:0;
        }
        .card-head h2 { font-size:20px; font-weight:700; }
        .card-head p { color:var(--text-secondary); font-size:13px; margin-top:2px; }
        /* ===== 使用说明 ===== */
        .usage-box {
            margin:16px 20px; padding:14px 16px; border-radius:8px;
            border:1px dashed var(--border-color); font-size:13px; line-height:1.8;
        }
        .usage-box .label { font-weight:700; margin-right:6px; }
        .usage-box .val { color:var(--text-secondary); }
        /* ===== 提示词块 ===== */
        .prompt-block {
            margin:12px 20px; border:1px solid var(--border-color); border-radius:10px; overflow:hidden;
        }
        .prompt-head {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 16px; background:var(--bg-tertiary); border-bottom:1px solid var(--border-color);
        }
        .prompt-head .tag { font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
        .tag-e { color:var(--success); }
        .tag-s { color:var(--accent); }
        .copy-btn {
            padding:4px 12px; font-size:12px; border-radius:5px; background:transparent;
            border:1px solid var(--border-color); color:var(--text-secondary); cursor:pointer; transition:all .2s;
        }
        .copy-btn:hover { border-color:var(--accent); color:var(--accent); }
        .copy-btn.copied { border-color:var(--success); color:var(--success); }
        .prompt-body {
            padding:16px; background:var(--code-bg); font-family:"SF Mono","Fira Code","JetBrains Mono",Consolas,monospace;
            font-size:13px; line-height:1.7; white-space:pre-wrap; word-break:break-word; max-height:500px; overflow-y:auto;
        }
        /* ===== 检查清单 ===== */
        .checklist { margin:12px 20px 16px; }
        .checklist-title { font-size:13px; font-weight:600; color:var(--warning); margin-bottom:8px; }
        .checklist ul { list-style:none; }
        .checklist li { padding:6px 0; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:8px; font-size:13px; }
        .checklist li:last-child { border-bottom:none; }
        .checklist input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
        /* ===== 下一步引导 ===== */
        .next-guide {
            margin:0 20px 16px; padding:12px 16px; border-radius:8px; font-size:13px;
            border:1px dashed var(--border-color); color:var(--text-secondary);
        }
        .next-guide strong { color:var(--text-primary); }
        /* ===== 连接线 ===== */
        .card-connector {
            text-align:center; padding:4px 0; color:var(--text-secondary); font-size:18px; opacity:.4;
        }
        /* ===== 主题色跟随 ===== */
        body.mode-a .card-badge { background:var(--mode-a); }
        body.mode-a .nav-item.active { color:var(--mode-a); border-left-color:var(--mode-a); }
        body.mode-a .nav-item.active .num { background:var(--mode-a); }
        body.mode-a .flow-step.current { border-color:var(--mode-a); color:var(--mode-a); background:rgba(63,185,80,.08); }
        body.mode-b .card-badge { background:var(--mode-b); }
        body.mode-b .nav-item.active { color:var(--mode-b); border-left-color:var(--mode-b); }
        body.mode-b .nav-item.active .num { background:var(--mode-b); }
        body.mode-b .flow-step.current { border-color:var(--mode-b); color:var(--mode-b); background:rgba(88,166,255,.08); }
        body.mode-c .card-badge { background:var(--mode-c); }
        body.mode-c .nav-item.active { color:var(--mode-c); border-left-color:var(--mode-c); }
        body.mode-c .nav-item.active .num { background:var(--mode-c); }
        body.mode-c .flow-step.current { border-color:var(--mode-c); color:var(--mode-c); background:rgba(210,153,34,.08); }
        /* ===== 响应式 ===== */
        @media(max-width:900px) {
            .sidebar { display:none; }
            .main-content { margin-left:0; padding:16px; }
            .mode-tabs { gap:4px; }
            .mode-btn { padding:6px 10px; font-size:12px; }
        }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:3px; }
    </style>
</head>
<body class="mode-b">
<!-- ===== 顶部栏 ===== -->
<div class="top-bar">
    <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>书童开发工作流</span>
        <span class="ver">v2.0</span>
    </div>
    <div class="mode-tabs">
        <button class="mode-btn active-b" onclick="setMode('a')" id="btn-a">🆕 从零新建</button>
        <button class="mode-btn active-b" onclick="setMode('b')" id="btn-b">➕ 新增功能</button>
        <button class="mode-btn active-b" onclick="setMode('c')" id="btn-c">🔧 修复问题</button>
    </div>
</div>

<div class="layout">
<!-- ===== 左侧导航 ===== -->
<nav class="sidebar" id="sidebar"></nav>

<!-- ===== 主内容区 ===== -->
<main class="main-content" id="main"></main>
</div>

<script>
// ========== 数据定义 ==========
const MODES = {
    a: {
        name:'从零新建项目', color:'mode-a', btnClass:'active-a',
        flow:['初始化','设计','契约','编码','验证','部署','完成'],
        stages:[
            {id:'a-init', num:1, title:'初始化', desc:'技术选型、目录结构、依赖规划、验收标准',
             exec:{tag:'执行AI',to:'窗口B',when:'从零新建项目时，第一步',
                   expect:'7个问题的答案 + [INIT_DONE]',next:'把结果复制给策略AI审查'},
             execText:`【阶段：INIT】从零新建项目，先搭建骨架，不改代码。

需求：{{你的项目需求}}

请回答以下问题。每个问题必须给出具体建议和理由。如果存在多种技术选型，列出选项和利弊对比。

1. 【技术选型】根据需求，推荐技术栈
   - 前端：框架、UI库、构建工具（如适用）
   - 后端：语言、框架、ORM（如适用）
   - 数据库：类型、版本（如适用）
   - 部署：目标平台、容器化方案（如适用）
   - 每个选择说明理由

2. 【目录结构】设计项目目录树
   - 用树状图展示完整目录结构
   - 每个目录/文件说明放什么内容
   - 标注哪些是核心模块、哪些是辅助模块

3. 【依赖规划】核心依赖有哪些？
   - 列出所有需要安装的依赖包
   - 建议版本号
   - 标注哪些是必须的、哪些是可选的

4. 【入口设计】主入口文件是什么？
   - 启动方式（命令行/脚本/双击）
   - 启动参数（如有）

5. 【配置设计】需要哪些配置文件？
   - 环境变量列表（名称、用途、默认值）
   - 配置文件格式（YAML/JSON/TOML/.env）

6. 【扩展预留】未来可能扩展的模块
   - 预留什么接口/目录

7. 【验收标准】你希望怎么证明这个项目"做完了"？
   - 功能清单：哪些功能必须可用？
   - 验收测试：怎么验证这些功能？

要求：
- 只输出设计，不生成代码
- 如果有不确定的技术选型，列出选项和利弊，等待用户确认
- 输出 [INIT_DONE]`,
             strat:{tag:'策略AI',to:'窗口A',when:'收到执行AI的INIT返回后',
                    expect:'完整性审查 + 技术选型确认 + 下一步指令',next:'按策略AI给出的指令，去「设计」阶段'},
             stratText:`【INIT审查任务】

请审查以下执行AI返回的项目初始化方案。

## 执行AI的INIT返回：
{{执行AI的INIT返回}}

## 你的任务：

### 第一步：完整性审查
- [ ] 7个问题全部回答
- [ ] 技术选型有具体框架名和版本号
- [ ] 目录结构有完整的树状图
- [ ] 依赖列表有包名和版本
- [ ] 入口文件和启动方式明确
- [ ] 配置文件清单完整
- [ ] 验收标准具体可测试（有功能清单和验收方式）
- [ ] 末尾有 [INIT_DONE] 标记

如果以上有任何一项未通过，输出【追问指令】。

### 第二步：技术选型确认
检查技术选型是否合理：
- 是否与用户需求匹配？
- 是否有明显的兼容性问题？
- 依赖数量是否合理？

### 第三步：输出下一阶段指令
如果审查通过，输出【DESIGN-架构设计】指令。

【审查通过！下一步】
→ 请去「02-设计」阶段，复制「执行AI提示词」`,
             checks:['7个问题全部回答','技术选型有具体框架名和版本号','目录结构有完整树状图','验收标准具体可测试','末尾有 [INIT_DONE] 标记']
            },
            {id:'a-design', num:2, title:'设计', desc:'数据流、骨架搭建顺序、模块依赖图、清理策略',
             exec:{tag:'执行AI',to:'窗口B',when:'INIT审查通过后',
                   expect:'6个问题的答案 + [DESIGN_DONE]',next:'把结果复制给策略AI审查'},
             execText:`【阶段：DESIGN-架构设计】只回答设计问题，不写代码，不执行命令。

基于 INIT 阶段确认的方案，本次目标：{{重复你的项目需求}}

已确认的技术栈：
- {{前端框架/后端框架/数据库/其他}}

已确认的目录结构：
{{粘贴INIT阶段确认的目录树}}

请回答：
1. 【数据流】项目的核心数据流是什么？用 → 表示。
2. 【骨架搭建顺序】按依赖关系排列需要创建的文件，标注被依赖的（必须先创建）。
3. 【模块依赖图】各模块之间的调用关系是什么？
4. 【清理策略】如果骨架搭建到一半失败，如何清理？
5. 【验证方案】每搭完一层（配置层/工具层/业务层），如何验证骨架不塌？
6. 【风险点】搭建过程中可能遇到什么问题？

回答清楚后，我回复"确认"你再开始搭建。
输出末尾加 [DESIGN_DONE]`,
             strat:{tag:'策略AI',to:'窗口A',when:'收到执行AI的设计返回后',
                    expect:'完整性审查 + 下一步指令',next:'按策略AI给出的指令，去「契约」阶段'},
             stratText:`【DESIGN-架构设计审查任务】

请审查以下执行AI返回的架构设计方案。

## 执行AI的架构设计返回：
{{执行AI的架构设计返回}}

## 你的任务：

### 第一步：完整性审查
- [ ] 有完整的数据流图（包含 → 箭头）
- [ ] 骨架搭建顺序按依赖排列（被依赖的在前）
- [ ] 有模块依赖图
- [ ] 清理策略明确（失败时删除哪些文件）
- [ ] 验证方案具体（具体运行什么命令）
- [ ] 列出了至少1个风险点
- [ ] 末尾有 [DESIGN_DONE] 标记

如果以上有任何一项未通过，输出【追问指令】。

### 第二步：输出下一阶段指令
如果审查通过，输出【CONTRACT-接口契约】指令。

【审查通过！下一步】
→ 请去「03-契约」阶段，复制「执行AI提示词」`,
             checks:['有完整数据流图','骨架搭建顺序按依赖排列','有模块依赖图','清理策略明确','验证方案具体','末尾有 [DESIGN_DONE] 标记']
            },
            {id:'a-contract', num:3, title:'契约', desc:'数据模型、API接口、模块接口、异常处理策略',
             exec:{tag:'执行AI',to:'窗口B',when:'设计审查通过后',
                   expect:'6个问题的答案 + [CONTRACT_DONE]',next:'把结果复制给策略AI审查'},
             execText:`【阶段：CONTRACT-从零】设计接口和数据模型，不写代码，不执行命令。

基于 DESIGN 阶段确认的架构设计：
{{粘贴DESIGN阶段确认的模块依赖图和数据流}}

【技术选型（已确认）】
- {{前端框架/后端框架/数据库/其他}}

请回答：
1. 【数据模型设计】核心数据实体有哪些？列出每个实体的字段名、类型、约束。
2. 【API接口设计】需要哪些接口？列出每个接口的路径、方法、请求参数、返回结构。
3. 【模块接口设计】各模块之间的函数/方法调用接口是什么？输入参数和返回值类型。
4. 【异常处理策略】每个模块的异常如何处理？是抛出还是捕获？错误码如何定义？
5. 【技术选型确认】请复述已确认的技术栈。
6. 【编码纪律确认】编码阶段是否一次只创建一个文件？确认。

确认后我回复"确认"，进入搭建。
输出末尾加 [CONTRACT_DONE]`,
             strat:{tag:'策略AI',to:'窗口A',when:'收到执行AI的契约确认后',
                    expect:'完整性审查 + 一致性审查 + 下一步指令',next:'按策略AI给出的指令，去「编码」阶段'},
             stratText:`【CONTRACT-从零审查任务】

请审查以下执行AI返回的接口和数据模型设计。

## 执行AI的契约确认：
{{执行AI的契约确认}}

## 你的任务：

### 第一步：完整性审查
- [ ] 数据模型有具体的字段名和类型
- [ ] API接口有路径、方法、参数、返回值
- [ ] 模块接口有函数签名和类型标注
- [ ] 异常处理策略明确
- [ ] 技术选型与INIT阶段确认的一致
- [ ] 编码纪律确认（一次只创建一个文件）
- [ ] 末尾有 [CONTRACT_DONE] 标记

### 第二步：一致性审查
- [ ] API接口的返回结构与数据模型字段一致
- [ ] 模块接口的参数类型与数据模型一致

### 第三步：输出下一阶段指令
如果审查通过，输出【CODE-骨架1】指令。

【审查通过！下一步】
→ 请去「04-编码」阶段，复制「执行AI提示词 - 配置层」`,
             checks:['数据模型有具体字段名和类型','API接口有路径/方法/参数/返回值','异常处理策略明确','编码纪律确认','末尾有 [CONTRACT_DONE] 标记']
            },
            {id:'a-code', num:4, title:'编码', desc:'按层级搭建：配置层→工具层→入口层→业务层，每层验证',

let currentMode = 'b';
let currentStage = 0;

// ========== 渲染 ==========
function setMode(m) {
    currentMode = m;
    currentStage = 0;
    document.body.className = 'mode-' + m;
    ['a','b','c'].forEach(k => {
        document.getElementById('btn-' + k).className = 'mode-btn ' + (k===m ? MODES[k].btnClass : '');
    });
    renderSidebar();
    renderMain();
}

function renderSidebar() {
    const mode = MODES[currentMode];
    let html = '<div class="nav-title">' + mode.name + '</div>';
    mode.stages.forEach((s, i) => {
        if (i > 0) html += '<div class="nav-arrow">↓</div>';
        html += '<div class="nav-item' + (i===currentStage?' active':'') + '" onclick="goStage('+i+')">';
        html += '<span class="num">'+s.num+'</span> '+s.title;
        html += '</div>';
    });
    html += '<div class="nav-arrow">↓</div>';
    html += '<div class="nav-end">✅ 结束</div>';
    document.getElementById('sidebar').innerHTML = html;
}

function renderMain() {
    const mode = MODES[currentMode];
    let html = '';
    // 流程图
    html += '<div class="flow-bar">';
    mode.flow.forEach((f, i) => {
        if (i > 0) html += '<span class="flow-arrow">→</span>';
        html += '<span class="flow-step'+(i===currentStage?' current':'')+'">'+f+'</span>';
    });
    html += '<span class="flow-loop">← 验证失败回退到编码</span>';
    html += '</div>';
    // 阶段卡片
    mode.stages.forEach((s, i) => {
        if (i > 0) html += '<div class="card-connector">↓</div>';
        html += renderCard(s, i);
    });
    document.getElementById('main').innerHTML = html;
}

function renderCard(s, idx) {
    let h = '<div class="stage-card" id="'+s.id+'">';
    h += '<div class="card-head"><div class="card-badge">'+s.num+'</div><div><h2>'+s.title+'</h2><p>'+s.desc+'</p></div></div>';
    // 执行AI
    if (s.exec) {
        h += renderUsage(s.exec, '执行AI提示词');
        h += '<div class="prompt-block"><div class="prompt-head"><span class="tag tag-e">E 执行AI提示词</span>';
        h += '<button class="copy-btn" onclick="copyPrompt(this)">一键复制</button></div>';
        h += '<div class="prompt-body">'+escHtml(s.execText)+'</div></div>';
    }
    // 策略AI
    if (s.strat) {
        h += renderUsage(s.strat, '策略AI提示词');
        h += '<div class="prompt-block"><div class="prompt-head"><span class="tag tag-s">S 策略AI提示词</span>';
        h += '<button class="copy-btn" onclick="copyPrompt(this)">一键复制</button></div>';
        h += '<div class="prompt-body">'+escHtml(s.stratText)+'</div></div>';
    }
    // 检查清单
    if (s.checks && s.checks.length) {
        h += '<div class="checklist"><div class="checklist-title">✓ 人工复核检查点</div><ul>';
        s.checks.forEach(c => { h += '<li><input type="checkbox"> '+c+'</li>'; });
        h += '</ul></div>';
    }
    // 下一步引导
    if (s.strat) {
        h += '<div class="next-guide"><strong>⬇️ 审查通过后，策略AI会告诉你下一步去哪</strong></div>';
    }
    h += '</div>';
    return h;
}

function renderUsage(info, label) {
    return '<div class="usage-box">'
        + '<div><span class="label">📋 使用说明</span></div>'
        + '<div><span class="label">发给：</span><span class="val">'+info.to+'（'+info.tag+'）</span></div>'
        + '<div><span class="label">时机：</span><span class="val">'+info.when+'</span></div>'
        + '<div><span class="label">预期结果：</span><span class="val">'+info.expect+'</span></div>'
        + '<div><span class="label">下一步：</span><span class="val">'+info.next+'</span></div>'
        + '</div>';
}


// ========== 交互 ==========
function goStage(i) {
    currentStage = i;
    renderSidebar();
    const el = document.getElementById(MODES[currentMode].stages[i].id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function copyPrompt(btn) {
    const block = btn.closest('.prompt-block');
    const body = block.querySelector('.prompt-body');
    navigator.clipboard.writeText(body.textContent).then(() => {
        btn.textContent = '已复制 ✓'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '一键复制'; btn.classList.remove('copied'); }, 1500);
    });
}


function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 滚动监听
const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
        if (e.isIntersecting) {
            const mode = MODES[currentMode];
            const idx = mode.stages.findIndex(s => s.id === e.target.id);
            if (idx >= 0) {
                currentStage = idx;
                renderSidebar();
            }
        }
    });
}, {rootMargin:'-100px 0px -60% 0px'});

// 初始化
setMode('b');
setTimeout(() => {
    MODES[currentMode].stages.forEach(s => {
        const el = document.getElementById(s.id);
        if (el) observer.observe(el);
    });
}, 100);
</script>
</body>
</html>
