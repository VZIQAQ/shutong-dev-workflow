<html lang="en">
<head>
 <meta charset="UTF-8">

 <title>Shutong Dev Workflow v2.0</title>
 <style>
 :root {
 --bg-primary: #0d1117;
 --bg-secondary: #161b22;
 --bg-tertiary: #21262d;
 --border-color: #30363d;
 --text-primary: #c9d1d9;
 --text-secondary: #8b949e;
 --accent: #58a6ff;
 --accent-hover: #79c0ff;
 --success: #3fb950;
 --warning: #d29922;
 --danger: #f85149;
 --code-bg: #1e2530;
 --mode-a: #3fb950; /* - build from scratch */
 --mode-b: #58a6ff; /* - add feature */
 --mode-c: #d29922; /* - fixissue */
 }
 * { margin:0; padding:0; box-sizing:border-box; }
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
 background: var(--bg-primary); color: var(--text-primary); line-height:1.6; overflow-x:hidden;
 }
 /* ===== ===== */
 .top-bar {
 position:fixed; top:0; left:0; right:0; height:60px;
 background:var(--bg-secondary); border-bottom:1px solid var(--border-color);
 display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:1000;
 }
 .logo { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; }
 .logo .ver { font-size:11px; color:var(--text-secondary); font-weight:400; background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; }
 .mode-tabs { display:flex; gap:8px; }
 .mode-btn {
 padding:8px 16px; border-radius:8px; border:2px solid var(--border-color);
 background:var(--bg-tertiary); color:var(--text-primary); cursor:pointer;
 font-size:13px; font-weight:600; transition:all .2s; white-space:nowrap;
 }
 .mode-btn:hover { border-color:var(--text-secondary); }
 .mode-btn.active-a { border-color:var(--mode-a); background:rgba(63,185,80,.12); color:var(--mode-a); }
 .mode-btn.active-b { border-color:var(--mode-b); background:rgba(88,166,255,.12); color:var(--mode-b); }
 .mode-btn.active-c { border-color:var(--mode-c); background:rgba(210,153,34,.12); color:var(--mode-c); }
 /* ===== ===== */
 .layout { display:flex; margin-top:60px; min-height:calc(100vh - 60px); }
 .sidebar {
 width:240px; background:var(--bg-secondary); border-right:1px solid var(--border-color);
 position:fixed; top:60px; bottom:0; overflow-y:auto; padding:16px 0;
 }
 .nav-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); padding:8px 16px; margin-bottom:4px; }
 .nav-item {
 display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer;
 color:var(--text-secondary); font-size:13px; transition:all .15s; border-left:3px solid transparent;
 }
 .nav-item:hover { background:var(--bg-tertiary); color:var(--text-primary); }
 .nav-item.active { background:rgba(88,166,255,.08); color:var(--accent); border-left-color:var(--accent); }
 .nav-item .num {
 display:inline-flex; align-items:center; justify-content:center;
 width:22px; height:22px; border-radius:5px; background:var(--bg-tertiary);
 font-size:11px; font-weight:700; flex-shrink:0;
 }
 .nav-item.active .num { background:var(--accent); color:#fff; }
 .nav-arrow { color:var(--text-secondary); font-size:10px; text-align:center; padding:2px 0; opacity:.4; }
 .nav-end { color:var(--text-secondary); font-size:12px; text-align:center; padding:12px 16px; border-top:1px dashed var(--border-color); margin-top:8px; }
 .main-content { margin-left:240px; margin-right:320px; flex:1; padding:28px 32px; max-width:920px; }
 /* ===== ===== */
 .notepad-panel {
 width:300px; position:fixed; top:60px; right:0; bottom:0;
 background:var(--bg-secondary); border-left:1px solid var(--border-color);
 display:flex; flex-direction:column; overflow:hidden;
 }
 .notepad-header {
 padding:14px 16px; border-bottom:1px solid var(--border-color);
 display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
 }
 .notepad-header h3 { font-size:14px; font-weight:700; }
 .notepad-tabs { display:flex; gap:4px; }
 .notepad-tab {
 padding:4px 10px; font-size:11px; border-radius:4px; border:1px solid var(--border-color);
 background:transparent; color:var(--text-secondary); cursor:pointer; transition:all .15s;
 }
 .notepad-tab:hover { border-color:var(--accent); color:var(--accent); }
 .notepad-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
 .notepad-actions { padding:8px 16px; border-bottom:1px solid var(--border-color); display:flex; gap:6px; flex-shrink:0; }
 .notepad-actions button {
 flex:1; padding:6px 0; font-size:12px; border-radius:5px; border:1px solid var(--border-color);
 background:var(--bg-tertiary); color:var(--text-primary); cursor:pointer; transition:all .15s;
 }
 .notepad-actions button:hover { border-color:var(--accent); color:var(--accent); }
 .notepad-list { flex:1; overflow-y:auto; padding:8px; }
 .notepad-card {
 background:var(--bg-primary); border:1px solid var(--border-color); border-radius:8px;
 margin-bottom:8px; overflow:hidden; transition:border-color .15s;
 }
 .notepad-card:hover { border-color:var(--text-secondary); }
 .notepad-card-head {
 padding:8px 10px; display:flex; align-items:center; justify-content:space-between;
 border-bottom:1px solid var(--border-color); background:var(--bg-tertiary);
 }
 .notepad-card-time { font-size:10px; color:var(--text-secondary); }
 .notepad-card-actions { display:flex; gap:4px; }
 .notepad-card-actions button {
 padding:2px 6px; font-size:10px; border-radius:3px; border:1px solid var(--border-color);
 background:transparent; color:var(--text-secondary); cursor:pointer; transition:all .15s;
 }
 .notepad-card-actions button:hover { border-color:var(--accent); color:var(--accent); }
 .notepad-card-actions button.del:hover { border-color:var(--danger); color:var(--danger); }
 .notepad-card-title {
 width:100%; padding:6px 10px; font-size:12px; font-weight:600; border:none; border-bottom:1px solid var(--border-color);
 background:transparent; color:var(--text-primary); outline:none;
 }
 .notepad-card-title:focus { border-bottom-color:var(--accent); }
 .notepad-card-body {
 width:100%; min-height:80px; padding:8px 10px; font-size:12px; border:none; resize:vertical;
 background:transparent; color:var(--text-primary); outline:none; line-height:1.6;
 font-family:inherit;
 }
 .notepad-card-body:focus { background:var(--bg-secondary); }
 .notepad-empty { text-align:center; padding:40px 16px; color:var(--text-secondary); font-size:13px; }
 .notepad-toggle {
 position:fixed; right:300px; top:50%; transform:translateY(-50%);
 width:20px; height:60px; background:var(--bg-secondary); border:1px solid var(--border-color);
 border-right:none; border-radius:6px 0 0 6px; cursor:pointer; z-index:999;
 display:flex; align-items:center; justify-content:center; color:var(--text-secondary);
 font-size:12px; transition:all .2s;
 }
 .notepad-toggle:hover { color:var(--accent); border-color:var(--accent); }
 .notepad-panel.hidden { display:none; }
 .notepad-panel.hidden ~ .notepad-toggle { right:0; }

 .notepad-panel { display:none; }
 .notepad-toggle { display:none; }
 .main-content { margin-right:0; }

 .flow-bar {
 display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:16px 20px;
 background:var(--bg-tertiary); border-radius:10px; margin-bottom:28px; border:1px solid var(--border-color);
 }
 .flow-step {
 padding:6px 14px; background:var(--bg-secondary); border:1px solid var(--border-color);
 border-radius:6px; font-size:12px; font-weight:600;
 }
 .flow-arrow { color:var(--text-secondary); font-size:14px; }
 .flow-loop { font-size:11px; color:var(--text-secondary); margin-left:8px; }

 padding:20px 24px 16px; border-bottom:1px solid var(--border-color);
 display:flex; align-items:center; gap:12px;

 width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
 font-size:18px; font-weight:700; color:#fff; flex-shrink:0;
 }
 .card-head h2 { font-size:20px; font-weight:700; }
 .card-head p { color:var(--text-secondary); font-size:13px; margin-top:2px; }

 border:1px dashed var(--border-color); font-size:13px; line-height:1.8;
 }
 .usage-box .label { font-weight:700; margin-right:6px; }
 .usage-box .val { color:var(--text-secondary); }

 .prompt-block {
 margin:12px 20px; border:1px solid var(--border-color); border-radius:10px; overflow:hidden;
 }
 .prompt-head {
 display:flex; align-items:center; justify-content:space-between;
 padding:12px 16px; background:var(--bg-tertiary); border-bottom:1px solid var(--border-color);
 }

 .tag-e { color:var(--success); }
 .tag-s { color:var(--accent); }

 border:1px solid var(--border-color); color:var(--text-secondary); cursor:pointer; transition:all .2s;
 }
 .copy-btn:hover { border-color:var(--accent); color:var(--accent); }
 .copy-btn.copied { border-color:var(--success); color:var(--success); }
 .prompt-body {
 padding:16px; background:var(--code-bg); font-family:"SF Mono","Fira Code","JetBrains Mono",Consolas,monospace;
 font-size:13px; line-height:1.7; white-space:pre-wrap; word-break:break-word; max-height:500px; overflow-y:auto;
 }
 /* ===== check ===== */
 .checklist { margin:12px 20px 16px; }
 .checklist-title { font-size:13px; font-weight:600; color:var(--warning); margin-bottom:8px; }
 .checklist ul { list-style:none; }
 .checklist li { padding:6px 0; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:8px; font-size:13px; }
 .checklist li:last-child { border-bottom:none; }
 .checklist input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
 /* ===== next step ===== */
 .next-guide {

 border:1px dashed var(--border-color); color:var(--text-secondary);
 }
 .next-guide strong { color:var(--text-primary); }
 /* ===== ===== */

 }
 /* ===== ===== */
 body.mode-a .card-badge { background:var(--mode-a); }
 body.mode-a .nav-item.active { color:var(--mode-a); border-left-color:var(--mode-a); }

 body.mode-a .flow-step.current { border-color:var(--mode-a); color:var(--mode-a); background:rgba(63,185,80,.08); }
 body.mode-b .card-badge { background:var(--mode-b); }
 body.mode-b .nav-item.active { color:var(--mode-b); border-left-color:var(--mode-b); }
 body.mode-b .nav-item.active .num { background:var(--mode-b); }
 body.mode-b .flow-step.current { border-color:var(--mode-b); color:var(--mode-b); background:rgba(88,166,255,.08); }
 body.mode-c .card-badge { background:var(--mode-c); }
 body.mode-c .nav-item.active { color:var(--mode-c); border-left-color:var(--mode-c); }
 body.mode-c .nav-item.active .num { background:var(--mode-c); }
 body.mode-c .flow-step.current { border-color:var(--mode-c); color:var(--mode-c); background:rgba(210,153,34,.08); }
 /* ===== ===== */
 @media(max-width:900px) {
 .sidebar { display:none; }
 .main-content { margin-left:0; padding:16px; }
 .mode-tabs { gap:4px; }
 .mode-btn { padding:6px 10px; font-size:12px; }

 ::-webkit-scrollbar { width:6px; }
 ::-webkit-scrollbar-track { background:var(--bg-primary); }
 ::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:3px; }
 </style>
</head>

let currentMode = 'b';
let currentStage = 0;

// ========== ==========
function setMode(m) {
 currentMode = m;
 currentStage = 0;
 document.body.className = 'mode-' + m;
 ['a','b','c'].forEach(k => {
 document.getElementById('btn-' + k).className = 'mode-btn ' + (k===m ? MODES[k].btnClass : '');
 });
 renderSidebar();
 renderMain();
}

function renderSidebar() {
 const mode = MODES[currentMode];
 let html = '<div class="nav-title">' + mode.name + '</div>';
 mode.stages.forEach((s, i) => {
 if (i > 0) html += '<div class="nav-arrow">↓</div>';
 html += '<div class="nav-item' + (i===currentStage?' active':'') + '" onclick="goStage('+i+')">';
 html += '<span class="num">'+s.num+'</span> '+s.title;
 html += '</div>';
 });
 html += '<div class="nav-arrow">↓</div>';
 html += '<div class="nav-end">✅ End</div>';
 document.getElementById('sidebar').innerHTML = html;
}

function renderMain() {
 const mode = MODES[currentMode];
 let html = '';
 // 
 html += '<div class="flow-bar">';
 mode.flow.forEach((f, i) => {
 if (i > 0) html += '<span class="flow-arrow">→</span>';
 html += '<span class="flow-step'+(i===currentStage?' current':'')+'">'+f+'</span>';
 });
 html += '<span class="flow-loop">← Verify failure falls back to Code</span>';
 html += '</div>';
 // stage
 mode.stages.forEach((s, i) => {
 if (i > 0) html += '<div class="card-connector">↓</div>';
 html += renderCard(s, i);
 });
 document.getElementById('main').innerHTML = html;
}

function renderCard(s, idx) {
 let h = '<div class="stage-card" id="'+s.id+'">';
 h += '<div class="card-head"><div class="card-badge">'+s.num+'</div><div><h2>'+s.title+'</h2><p>'+s.desc+'</p></div></div>';
 // Execution AI
 if (s.exec) {
 h += renderUsage(s.exec, 'Execution AIprompt');
 h += '<div class="prompt-block"><div class="prompt-head"><span class="tag tag-e">E Execution AIprompt</span>';
 h += '<button class="copy-btn" onclick="copyPrompt(this)">Copy</button></div>';
 h += '<div class="prompt-body">'+escHtml(s.execText)+'</div></div>';
 }
 // Strategy AI
 if (s.strat) {
 h += renderUsage(s.strat, 'Strategy AIprompt');
 h += '<div class="prompt-block"><div class="prompt-head"><span class="tag tag-s">S Strategy AIprompt</span>';
 h += '<button class="copy-btn" onclick="copyPrompt(this)">Copy</button></div>';
 h += '<div class="prompt-body">'+escHtml(s.stratText)+'</div></div>';
 }
 // check
 if (s.checks && s.checks.length) {
 h += '<div class="checklist"><div class="checklist-title">✓ Manual Review Checklist</div><ul>';
 s.checks.forEach(c => { h += '<li><input type="checkbox"> '+c+'</li>'; });
 h += '</ul></div>';
 }
 // next step
 if (s.strat) {
 h += '<div class="next-guide"><strong>⬇️ After review passes, the Strategy AI will tell you where to go next</strong></div>';
 }
 h += '</div>';
 return h;
}

function renderUsage(info, label) {
 return '<div class="usage-box">'
 + '<div><span class="label">📋 Instructions</span></div>'
 + '<div><span class="label">Send to: </span><span class="val">'+info.to+'（'+info.tag+'）</span></div>'
 + '<div><span class="label">When: </span><span class="val">'+info.when+'</span></div>'
 + '<div><span class="label">Expected: </span><span class="val">'+info.expect+'</span></div>'
 + '<div><span class="label">Next: </span><span class="val">'+info.next+'</span></div>'
 + '</div>';
}


// ========== ==========
function goStage(i) {
 currentStage = i;
 renderSidebar();
 const el = document.getElementById(MODES[currentMode].stages[i].id);
 if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function copyPrompt(btn) {
 const block = btn.closest('.prompt-block');
 const body = block.querySelector('.prompt-body');
 navigator.clipboard.writeText(body.textContent).then(() => {
 btn.textContent = 'Copied ✓'; btn.classList.add('copied');
 setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
 });
}


function escHtml(s) {
 return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 
const observer = new IntersectionObserver(entries => {
 entries.forEach(e => {
 if (e.isIntersecting) {
 const mode = MODES[currentMode];
 const idx = mode.stages.findIndex(s => s.id === e.target.id);
 if (idx >= 0) {
 currentStage = idx;
 renderSidebar();
 }
 }
 });
}, {rootMargin:'-100px 0px -60% 0px'});

// ========== ==========
let notepadType = 'req'; // 'req' or 'note'
const NP_KEY = 'shutong_notepads';

function loadNotepads() {
 try { return JSON.parse(localStorage.getItem(NP_KEY)) || {req:[],note:[]}; }
 catch(e) { return {req:[],note:[]}; }
}

function saveNotepads(data) {
 localStorage.setItem(NP_KEY, JSON.stringify(data));
}

function setNotepadType(type) {
 notepadType = type;
 document.querySelectorAll('.notepad-tab').forEach(t => t.classList.remove('active'));
 document.querySelector('.notepad-tab[onclick*="'+type+'"]').classList.add('active');
 renderNotepads();
}

function addNotepad() {
 const data = loadNotepads();
 const now = new Date();
 const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 const item = {id:Date.now(), title:notepadType==='req'?'requirement':'', body:'', time:ts};
 data[notepadType].unshift(item);
 saveNotepads(data);
 renderNotepads();
}

function deleteNotepad(id) {
 const data = loadNotepads();
 data[notepadType] = data[notepadType].filter(n => n.id !== id);
 saveNotepads(data);
 renderNotepads();
}

function updateNotepad(id, field, value) {
 const data = loadNotepads();
 const item = data[notepadType].find(n => n.id === id);
 if (item) { item[field] = value; saveNotepads(data); }
}

function copyNotepadBody(id) {
 const data = loadNotepads();
 const item = data[notepadType].find(n => n.id === id);
 if (!item) return;
 navigator.clipboard.writeText(item.body).then(() => {
 const btn = document.querySelector('[data-copy="'+id+'"]');
 if (btn) { btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='copy',1200); }
 });
}

function exportNotepads() {
 const data = loadNotepads();
 let text = '=== requirement ===\n\n';
 data.req.forEach(n => { text += '## '+n.title+' ('+n.time+')\n'+n.body+'\n\n'; });
 text += '=== ===\n\n';
 data.note.forEach(n => { text += '## '+n.title+' ('+n.time+')\n'+n.body+'\n\n'; });
 const blob = new Blob([text], {type:'text/plain'});
 const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
 a.download = 'shutong-notepads.txt'; a.click();
}

function toggleNotepad() {
 const panel = document.getElementById('notepadPanel');
 const btn = document.getElementById('notepadToggle');
 panel.classList.toggle('hidden');
 btn.textContent = panel.classList.contains('hidden') ? '▶' : '◀';
 document.querySelector('.main-content').style.marginRight = panel.classList.contains('hidden') ? '0' : '320px';
}

function renderNotepads() {
 const data = loadNotepads();
 const list = data[notepadType];
 const container = document.getElementById('notepadList');
 if (!list.length) {
 container.innerHTML = '<div class="notepad-empty">'+(notepadType==='req'?'requirement':'')+'<br>「＋ New」</div>';
 return;
 }
 let html = '';
 list.forEach(n => {
 html += '<div class="notepad-card">';
 html += '<div class="notepad-card-head">';
 html += '<span class="notepad-card-time">'+n.time+'</span>';
 html += '<div class="notepad-card-actions">';
 html += '<button data-copy="'+n.id+'" onclick="copyNotepadBody('+n.id+')">copy</button>';
 html += '<button class="del" onclick="deleteNotepad('+n.id+')"></button>';
 html += '</div></div>';
 html += '<input class="notepad-card-title" value="'+n.title.replace(/"/g,'&quot;')+'" onchange="updateNotepad('+n.id+',\'title\',this.value)">';
 html += '<textarea class="notepad-card-body" placeholder="content..." oninput="updateNotepad('+n.id+',\'body\',this.value)">'+n.body+'</textarea>';
 html += '</div>';
 });
 container.innerHTML = html;
}

function initNotepad() { renderNotepads(); }

// init
setMode('b');
setTimeout(() => {
 MODES[currentMode].stages.forEach(s => {
 const el = document.getElementById(s.id);
 if (el) observer.observe(el);
 });
}, 100);
initNotepad();
</script>
</body>
</html>
